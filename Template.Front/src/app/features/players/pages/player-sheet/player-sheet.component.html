<section class="player-sheet">
    <gc-widget-workspace
        [workspace]="workspace()"
        [catalog]="catalog"
        [canEdit]="true"
        [columns]="columns"
        [rowHeight]="rowHeight"
        [(editing)]="editing"
        navLabel="Pages"
        (save)="onSave($event)"
    >
        <tpl-widget-template-host
            [loadingItems]="loadingItems()"
            [items]="items.value()"
            [rowPlaceholders]="rowPlaceholders"
        />
    </gc-widget-workspace>
</section>
